# Fragen des Bewerbungsformulars auf /bewerbung.html
#
# Die Antworten landen im Google-Formular der Clubleitung.
# "id" ist die Nummer der Frage im Google-Formular (entry.<id>).
# Wird im Google-Formular eine Frage NEU angelegt, bekommt sie eine neue Nummer –
# dann muss sie hier angepasst werden. Reine Textänderungen an der Frage sind egal.
#
# typ:       text | zahl | absatz | auswahl
# pflicht:   true = muss ausgefüllt werden
# sonstiges: true = zusätzliche Option "Sonstiges" mit eigenem Textfeld

- id: 698113676
  typ: text
  frage: Wie lautet dein Discord-Name?
  hinweis: Damit wir dich kontaktieren können.
  pflicht: true

- id: 1884265043
  typ: text
  frage: Wie ist dein SSO-Name?
  pflicht: true

- id: 729773919
  typ: text
  frage: Wie dürfen wir dich nennen?
  hinweis: Zum Beispiel dein Spitzname.
  pflicht: true

- id: 1005816283
  typ: zahl
  frage: Wie alt bist du?
  hinweis: Trau dich auch, wenn du das Mindestalter nicht erreicht hast. Wir machen Ausnahmen, wenn wir merken, dass du zu uns passt!
  pflicht: true

- id: 747091318
