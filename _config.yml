# Grundeinstellungen der Website
title: Moon Vampires Division
tagline: "⏾ Im Mondlicht sind wir euer Schicksal 🦇"
description: "Moon Vampires Division – ein Dressurclub, der mit dir wachsen will. Alles über uns, unsere Uniform, Clubtreffen, das Rangsystem und deine Bewerbung."
lang: de

# Adresse der Seite.
# Heißt das Repository <benutzername>.github.io, bleibt baseurl leer.
# Heißt es anders (z. B. "moonvampires"), hier "/moonvampires" eintragen.
url: "https://moonvampiresdivision.github.io"
baseurl: ""

# Links (Social Media stehen in _data/social.yml)
# Bewerbung: Das eigene Formular (bewerbung.html) sendet an "bewerbung_ziel".
# "bewerbung_google" ist der Ausweich-Link, falls etwas nicht klappt.
bewerbung_ziel: https://docs.google.com/forms/d/e/1FAIpQLSe1VFn8sNr0fqXc9M6VGDhzibzYSbAlL79_PRi8R5dRPi4vCg/formResponse
bewerbung_google: https://docs.google.com/forms/d/e/1FAIpQLSe1VFn8sNr0fqXc9M6VGDhzibzYSbAlL79_PRi8R5dRPi4vCg/viewform

# Google Search Console: bestätigt über die Datei googlea0a8de82222a718d.html im Hauptordner
# (bitte nicht löschen). Optional ginge auch ein HTML-Tag-Code: Zeile unten aktivieren (nur der Wert):
# google_site_verification: CODE

# Erstellt automatisch /sitemap.xml (Liste aller Seiten für Suchmaschinen)
plugins:
  - jekyll-sitemap

# Google-Bestätigungsdatei nicht in der Sitemap aufführen
defaults:
  - scope:
      path: googlea0a8de82222a718d.html
    values:
      sitemap: false

exclude:
  - README.md
